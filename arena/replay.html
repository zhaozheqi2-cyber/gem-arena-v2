<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gem Arena v2 · 基础版回放</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf1fa;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:1560px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:31px;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:#70d9c2}small,.muted{color:#9babc1}#layout{display:grid;grid-template-columns:250px 1fr 250px;gap:18px;margin:22px 0}.player{background:#151f30;border:2px solid #29354b;border-radius:16px;padding:16px;align-self:start}.active{border-color:#70d9c2}.score{font-size:58px;font-weight:750}.gems{display:flex;gap:5px;flex-wrap:wrap}.gem{display:inline-flex;border-radius:7px;align-items:center;justify-content:center;min-width:29px;height:27px;color:#09101a;font-weight:750;border:1px solid #74819a;font-size:13px}.c0{background:#e5ebf4}.c1{background:#6ab1ff}.c2{background:#65d7b0}.c3{background:#f98a96}.c4{background:#a499c9}.c5{background:#f7d260}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 15px}.card{background:#1a263b;border:1px solid #38465e;border-radius:11px;padding:11px;min-height:105px}.card b{font-size:26px}.cardtop{display:flex;justify-content:space-between;margin-bottom:12px}.tier{font-size:12px;letter-spacing:2px;color:#9caac0}.bank{background:#151f30;border-radius:12px;padding:12px;margin:14px 0;display:flex;gap:12px;align-items:center}.nobles{display:flex;gap:8px;flex-wrap:wrap}.noble{background:#2a2340;border:1px solid #7d668e;border-radius:10px;padding:10px;flex:1;min-width:155px}.reserved{display:grid;gap:8px;margin-top:10px}.reserved .card{min-height:80px}.hidden{color:#b9a8df;background:repeating-linear-gradient(45deg,#211d38,#211d38 8px,#29233f 8px,#29233f 16px)}button,select{background:#22334d;color:white;border:1px solid #4d627d;border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:#355074}.controls{display:flex;gap:9px;align-items:center}input{flex:1;accent-color:#70d9c2}#event{background:#16253a;border-left:3px solid #70d9c2;padding:15px;margin:15px 0;min-height:55px}#result{color:#70d9c2;font-size:22px}footer{font-size:12px;color:#94a3b8}h2{font-size:21px;overflow-wrap:anywhere}.badge{color:#f7d260} @media(max-width:1050px){#layout{grid-template-columns:1fr}.score{font-size:40px}.player .reserved{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){main{padding:12px}.row{grid-template-columns:repeat(2,1fr)}.controls{flex-wrap:wrap}}
@media(min-width:1051px) and (max-height:850px){body{font-size:14px}main{padding:16px}h1{font-size:25px;margin:5px 0}#layout{gap:14px;margin:14px 0}.player{padding:12px}.player p{margin:10px 0}.score{font-size:44px}.card{min-height:82px;padding:8px}.card b{font-size:23px}.cardtop{margin-bottom:8px}.gem{height:24px;min-width:26px;font-size:12px}.row{margin:5px 0 9px}.noble{padding:8px;font-size:13px}.bank{padding:8px;margin:10px 0}#event{padding:11px;margin:10px 0}#result{font-size:18px}footer{font-size:10px}footer p{margin:6px 0}.reserved{max-height:260px;overflow:auto}.reserved .card{min-height:70px}}
</style><main><header><div><div class="eyebrow">GEM ARENA / BASE GAME · V2</div><h1 id="title"></h1><small id="subtitle"></small></div><button id="full">全屏录制</button></header>
<div id="layout"><section id="p0" class="player"></section><section><div class="tier">贵族 · 达标后每回合来访一位 · 每位 3 分</div><div id="nobles" class="nobles"></div><div id="bank" class="bank"></div><div id="market"></div></section><section id="p1" class="player"></section></div>
<div id="result"></div><div id="event"></div><div class="controls"><button id="prev">←</button><button id="play">播放</button><button id="next">→</button><input id="slider" type="range" min="0" value="0" aria-label="回放进度"><select id="speed" aria-label="播放速度"><option value="1200">慢速</option><option value="650" selected>正常</option><option value="250">快速</option></select><span id="counter"></span></div>
<footer><p>基础版双人规则 · 贵族 / 黄金 / 预留 · 退币与选贵族仍属同一回合。盲抽预留牌在旁观回放中保持隐藏，购买时才公开。</p><p>空格播放／暂停，左右键单步。全部数据内嵌，可离线打开。数值展示采用原创界面，无官方卡面插画。</p></footer></main>
<script>
const game=__GAME_DATA__;
const $=id=>document.getElementById(id),colors=['白','蓝','绿','红','黑','金'];let frame=0,timer=null;
function gem(n,i){return `<span class="gem c${i}" title="${colors[i]}">${colors[i]}${n}</span>`}
function gems(a){return a.map(gem).join('')}
function card(c){return `<div class="card"><div class="cardtop"><b>${c.points}<small> 分</small></b>${gem('+1',c.bonus)}</div><div class="gems">${c.cost.map((n,i)=>n?gem(n,i):'').join('')}</div><small>${c.id} · L${c.tier}</small></div>`}
function list(a){return a.map((n,i)=>n?colors[i]+n:'').filter(Boolean).join(' / ')||'免费'}
$('title').textContent=game.names.join(' vs ');$('subtitle').textContent=`GAME ${String(game.game).padStart(2,'0')} · SEED ${game.seed} · 先手：${game.names[game.order[0]]}`;$('slider').max=game.frames.length-1;
function draw(){const f=game.frames[frame],s=f.state;
for(let seat=0;seat<2;seat++){const p=s.players[seat],el=$('p'+seat);el.className='player'+(!s.done&&s.to_play===seat?' active':'');el.replaceChildren();const title=document.createElement('h2');title.textContent=game.names[game.order[seat]];el.append(title);const stats=document.createElement('div');stats.innerHTML=`<small>${seat===0?'先手':'后手'} · ${p.cards.length} 张发展牌</small><div class="score">${p.score}<small style="font-size:18px"> / 15</small></div><p>持有筹码 · ${p.tokens.reduce((a,b)=>a+b,0)} / 10</p><div class="gems">${gems(p.tokens)}</div><p>永久折扣</p><div class="gems">${gems(p.bonuses)}</div><p class="badge">已获贵族：${p.nobles.join('、')||'暂无'}</p><p>预留牌 · ${p.reserved.length} / 3</p><div class="reserved">${p.reserved.map(r=>r.card?card(r.card):`<div class="card hidden">暗牌 · L${r.tier}<p>仅持有者可见</p></div>`).join('')||'<small>暂无预留</small>'}</div>`;el.append(stats)}
$('nobles').innerHTML=s.nobles.map(n=>`<div class="noble"><div>${n.id} · <b>3 分</b></div><div class="gems">${n.requirements.map((v,i)=>v?gem(v,i):'').join('')}</div></div>`).join('')||'<small>贵族均已来访</small>';
$('bank').innerHTML='<small>公共筹码池</small><div class="gems">'+gems(s.bank)+'</div>';
$('market').innerHTML=[2,1,0].map(t=>`<div class="tier">LEVEL ${t+1} · 牌堆剩余 ${s.deck_counts[t]}</div><div class="row">`+s.market[t].map(card).join('')+'</div>').join('');
const e=f.event;let text='开局 · 贵族已入席，黄金已入库';if(e){const a=e.action;let action=e.status!=='ok'?'判负：'+e.status:a.type==='buy'?`购买${a.source==='reserved'?'预留牌':'发展牌'} ${a.card} · 支付 ${list(a.payment)}`:a.type==='take'?'拿取 '+list(a.tokens):a.type==='reserve'?(a.source==='deck'?`盲抽预留 L${a.tier}`:'预留明牌 '+a.card):a.type==='discard'?'回合内退币 '+list(a.tokens):a.type==='noble'?'贵族来访 '+a.noble+' · +3 分':'无合法普通行动，跳过';text=`第 ${e.ply} 手 · ${game.names[e.agent]} · ${action} · ${e.elapsed_ms.toFixed(1)} ms`}$('event').textContent=text;
const phases={main:'行动',discard:'退回超额筹码',noble:'选择贵族'};
$('result').textContent=s.done?`比赛结束 · ${game.winner===null?'平局':game.names[game.winner]+' 获胜'} · ${game.reason==='turn_limit'?'安全手数上限（非官方终局）':game.reason}`:`第 ${s.turn+1} 手 · ${phases[s.phase]}${s.end_triggered?' · 最后一轮':''}`;
$('slider').value=frame;$('counter').textContent=`${frame} / ${game.frames.length-1}`;}
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放'}function step(n){frame=Math.max(0,Math.min(game.frames.length-1,frame+n));draw();if(frame===game.frames.length-1)stop()}
$('play').onclick=()=>{if(timer){stop();return}if(frame===game.frames.length-1)frame=0;draw();$('play').textContent='暂停';timer=setInterval(()=>step(1),Number($('speed').value))};$('prev').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('slider').oninput=()=>{stop();frame=Number($('slider').value);draw()};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};$('full').onclick=()=>document.documentElement.requestFullscreen();document.onkeydown=e=>{if(['Space','ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();if(e.code==='Space')$('play').click();else{stop();step(e.code==='ArrowLeft'?-1:1)}}};draw();
</script></html>
